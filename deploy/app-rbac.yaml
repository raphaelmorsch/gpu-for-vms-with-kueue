apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-vm-console
  namespace: gpu-vm-kueue
  labels:
    app.kubernetes.io/name: gpu-vm-kueue
    app.kubernetes.io/part-of: gpu-for-vms-with-kueue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-vm-console
  labels:
    app.kubernetes.io/name: gpu-vm-kueue
    app.kubernetes.io/part-of: gpu-for-vms-with-kueue
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources:
      - clusterqueues
      - clusterqueues/status
      - localqueues
      - localqueues/status
      - resourceflavors
      - workloads
      - workloads/status
      - cohorts
      - admissionchecks
      - topologies
      - workloadpriorityclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kueue.openshift.io"]
    resources: ["kueues"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
    verbs: ["update", "get"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["hyperconvergeds"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["kubevirts"]
    verbs: ["get", "list"]
  - apiGroups: ["template.openshift.io"]
    resources: ["templates"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-vm-console
  labels:
    app.kubernetes.io/name: gpu-vm-kueue
    app.kubernetes.io/part-of: gpu-for-vms-with-kueue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-vm-console
subjects:
  - kind: ServiceAccount
    name: gpu-vm-console
    namespace: gpu-vm-kueue
